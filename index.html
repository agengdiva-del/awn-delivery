    <script>
      (function() {
        // Prevent Chrome extension TypeError when interceptors try to set window.fetch
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : null;
          var _fetchRef = origFetch;
          var fetchProp = {
            get: function() { return _fetchRef; },
            set: function(v) { _fetchRef = v; },
            configurable: true,
            enumerable: true
          };
          try { Object.defineProperty(window, 'fetch', fetchProp); } catch (e) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try { Object.defineProperty(Window.prototype, 'fetch', fetchProp); } catch (e) {}
          }
        } catch (err) {}

        // Suppress errors originating from browser extensions (e.g. chrome-extension://)
        function isExtError(msg, url, stack) {
          var sMsg = String(msg || '');
          var sUrl = String(url || '');
          var sStack = String(stack || '');
          return sUrl.indexOf('chrome-extension://') !== -1 ||
                 sMsg.indexOf('chrome-extension://') !== -1 ||
                 sStack.indexOf('chrome-extension://') !== -1 ||
                 sMsg.indexOf('Cannot set property fetch') !== -1;
        }

        window.addEventListener('error', function(e) {
          if (isExtError(e.message, e.filename, e.error && e.error.stack)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isExtError(msg, url, error && error.stack)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
        };

        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          if (isExtError(r && r.message, '', r && r.stack)) {
            e.preventDefault();
          }
        }, true);
      })();
    </script>
